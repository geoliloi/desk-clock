<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧桌曆時鐘</title>
  
  <!-- 防止快取，確保開啟即為最新版 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- iOS 全螢幕 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智慧桌曆時鐘">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 7 段式 LCD 電子字型 (DSEG7 Classic) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      background-color: #030305;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      width: 100vw;
      min-height: 100vh;
      touch-action: manipulation;
    }

    /* 7 段式 LCD 電子時鐘風格 */
    .font-dseg {
      font-family: 'DSEG7-Classic', 'DSEG7-Classic-Regular', monospace;
      font-style: italic;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    .lcd-ghost {
      color: rgba(255, 255, 255, 0.06);
      user-select: none;
      pointer-events: none;
    }

    .lcd-real {
      color: #FFFFFF;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.3);
    }

    /* 黑底白框極簡立體卡片 */
    .white-frame {
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      background: #09090D;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.04);
    }

    .white-frame-sub {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
    }

    /* 滾動條樣式 */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    /* 確保直向輸入時表單具有良好空間 */
    @media (orientation: portrait) {
      .main-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
        overflow-y: auto;
      }
      .portrait-order-1 { order: 1; }
      .portrait-order-2 { order: 2; }
      .portrait-order-3 { order: 3; }
      body {
        overflow-y: auto;
      }
    }
  </style>
</head>
<body class="p-2 sm:p-3 flex flex-col justify-between min-h-screen w-screen">

  <!-- 頂部微型狀態條 -->
  <header class="flex justify-between items-center px-2 py-1 mb-2 border-b border-zinc-800/80 text-[11px] text-zinc-400">
    <div class="flex items-center gap-2">
      <span id="sync-dot" class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="tracking-widest font-semibold text-zinc-200">DESK DISPLAY</span>
      <span class="text-zinc-600">|</span>
      <span id="sync-status" class="text-zinc-400 truncate max-w-[140px] sm:max-w-none">系統就緒</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="requestFullScreen()" class="hover:text-white px-2 py-0.5 rounded bg-zinc-900 border border-zinc-700/80 flex items-center gap-1 text-[10px]">
        <i data-lucide="maximize" class="w-3 h-3 text-zinc-300"></i>
        <span class="hidden sm:inline">全螢幕</span>
      </button>
      <button onclick="openConfigModal()" class="hover:text-white px-2 py-0.5 rounded bg-zinc-900 border border-zinc-700/80 flex items-center gap-1 text-[10px]">
        <i data-lucide="settings" class="w-3 h-3 text-zinc-300"></i>
        <span>設定</span>
      </button>
    </div>
  </header>

  <!-- 主畫面：橫向 3 欄 / 直向自適應堆疊 -->
  <main class="main-grid grid grid-cols-12 gap-2.5 flex-1 min-h-0">
    
    <!-- ================= 1. 左側：7 段式電子鐘與日期 (橫向5欄 / 直向第1位) ================= -->
    <section class="col-span-12 sm:col-span-5 portrait-order-1 white-frame p-3.5 flex flex-col justify-between items-center text-center relative overflow-hidden min-h-[170px] sm:min-h-0">
      <div class="w-full flex justify-between items-center text-xs text-zinc-400 px-0.5">
        <span id="date-weekday" class="font-bold tracking-widest text-zinc-200 text-sm">星期--</span>
        <span class="text-[11px] text-zinc-400 font-mono">澳門 GMT+8</span>
      </div>

      <!-- 7 段式 LCD 數位時鐘 -->
      <div class="my-auto py-2 flex flex-col items-center justify-center">
        <div class="relative inline-block font-dseg text-6xl sm:text-7xl font-bold leading-none select-none">
          <div class="lcd-ghost tracking-widest" aria-hidden="true">88:88</div>
          <div id="clock-display" class="absolute inset-0 lcd-real tracking-widest flex items-center justify-center">--:--</div>
        </div>
        <!-- 今日時間進度條 -->
        <div class="w-full bg-zinc-800/80 h-1.5 rounded-full mt-3 overflow-hidden border border-zinc-700/50">
          <div id="day-progress-bar" class="bg-gradient-to-r from-blue-400 to-indigo-400 h-full w-0 transition-all duration-1000"></div>
        </div>
      </div>

      <div class="w-full text-center border-t border-zinc-800/80 pt-1.5 flex justify-between items-center">
        <div id="date-string" class="text-sm sm:text-base tracking-wide font-bold text-white">----年--月--日</div>
        <div id="day-progress-text" class="text-[10px] text-zinc-400 font-mono">今日已過 --%</div>
      </div>
    </section>

    <!-- ================= 2. 中間：今日行程列表 (橫向4欄 / 直向第2位) ================= -->
    <section class="col-span-12 sm:col-span-4 portrait-order-2 white-frame p-3 flex flex-col min-h-[220px] sm:min-h-0 justify-between">
      <div class="flex justify-between items-center pb-1.5 border-b border-zinc-800/80 mb-1.5">
        <div class="flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-300"></i>
          <span class="text-xs font-bold tracking-wider text-white">今日日程</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="openAddEventModal()" class="text-[11px] px-2.5 py-1 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium flex items-center gap-1 shadow">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>新增</span>
          </button>
          <button onclick="syncCalendarData(true)" title="重新整理" class="text-zinc-400 hover:text-white p-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="cal-spin"></i>
          </button>
        </div>
      </div>

      <!-- 滾動行程清單 -->
      <div id="calendar-event-list" class="flex-1 overflow-y-auto space-y-1.5 pr-0.5 min-h-[120px] max-h-[260px] sm:max-h-none">
        <div class="text-center text-zinc-500 text-xs py-8">正在載入行程...</div>
      </div>

      <!-- 底部微控制條 -->
      <div class="pt-1.5 border-t border-zinc-800/80 text-[10px] text-zinc-500 flex justify-between items-center">
        <span id="cal-sync-time">尚未同步</span>
        <button onclick="openManageModal()" class="text-indigo-400 hover:underline flex items-center gap-1">
          <i data-lucide="list" class="w-3 h-3"></i>
          <span>管理所有行程</span>
        </button>
      </div>
    </section>

    <!-- ================= 3. 右側：澳門望廈實時天氣 (橫向3欄 / 直向第3位) ================= -->
    <section class="col-span-12 sm:col-span-3 portrait-order-3 white-frame p-3 flex flex-col justify-between min-h-[200px] sm:min-h-0">
      <div class="flex justify-between items-center pb-1 border-b border-zinc-800/80">
        <div class="flex items-center gap-1 text-xs font-bold text-white">
          <i data-lucide="map-pin" class="w-3 h-3 text-sky-400"></i>
          <span>澳門 • 望廈</span>
        </div>
        <button onclick="fetchWeather(true)" title="更新天氣" class="text-zinc-400 hover:text-white">
          <i data-lucide="rotate-cw" class="w-3 h-3" id="weather-spin"></i>
        </button>
      </div>

      <!-- 即時溫度與天氣狀態 -->
      <div class="my-auto py-1 text-center">
        <div class="flex items-center justify-center gap-1.5">
          <div id="weather-icon-box" class="text-amber-400">
            <i data-lucide="sun" class="w-7 h-7"></i>
          </div>
          <span id="weather-temp" class="text-3xl font-black tracking-tight text-white">--</span>
          <span class="text-lg font-bold text-sky-400">°C</span>
        </div>
        <div id="weather-desc" class="text-xs text-zinc-300 font-medium mt-0.5">載入天氣中...</div>
      </div>

      <!-- 今日天氣趨勢 (未來數小時預測條) -->
      <div class="pt-1.5 pb-1 border-t border-zinc-800/80">
        <div class="text-[9px] text-zinc-400 flex justify-between items-center mb-1 px-0.5">
          <span class="font-semibold text-zinc-300">今日趨勢</span>
          <span id="weather-rain-prob" class="text-sky-400 font-mono text-[9px]">降雨率 --%</span>
        </div>
        <div id="weather-hourly-strip" class="grid grid-cols-4 gap-1 text-center">
          <!-- 小時區塊由 JS 動態生成 -->
        </div>
      </div>

      <!-- 4 格指標 (體感、濕度、紫外線、風速) -->
      <div class="grid grid-cols-2 gap-1.5 text-center text-[10px] pt-1.5 border-t border-zinc-800/80">
        <div class="white-frame-sub p-1 bg-zinc-950/70">
          <div class="text-zinc-500 text-[9px]">體感</div>
          <div id="weather-feel" class="font-semibold text-white">--°</div>
        </div>
        <div class="white-frame-sub p-1 bg-zinc-950/70">
          <div class="text-zinc-500 text-[9px]">濕度</div>
          <div id="weather-humidity" class="font-semibold text-white">--%</div>
        </div>
        <div class="white-frame-sub p-1 bg-zinc-950/70">
          <div class="text-zinc-500 text-[9px]">紫外線</div>
          <div id="weather-uv" class="font-semibold text-white">--</div>
        </div>
        <div class="white-frame-sub p-1 bg-zinc-950/70">
          <div class="text-zinc-500 text-[9px]">風速</div>
          <div id="weather-wind" class="font-semibold text-white">-- km/h</div>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= 彈窗 A：新增家庭日程 (全面適應直向與防鍵盤遮蔽) ================= -->
  <div id="add-event-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 z-50 overflow-y-auto hidden">
    <div class="bg-[#101014] white-frame w-full max-w-sm p-4 text-xs space-y-3.5 my-auto max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2.5">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <i data-lucide="calendar-plus" class="w-4 h-4 text-indigo-400"></i> 新增家庭日程
        </h3>
        <button onclick="closeAddEventModal()" class="text-zinc-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-zinc-300 font-medium mb-1">事項名稱 <span class="text-rose-400">*</span></label>
          <input type="text" id="new-evt-title" placeholder="例如：看醫生、聚餐、買日常用品"
            class="w-full p-2.5 bg-black border border-zinc-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-400">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-zinc-300 font-medium mb-1">日期 <span class="text-rose-400">*</span></label>
            <input type="date" id="new-evt-date"
              class="w-full p-2.5 bg-black border border-zinc-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-400">
          </div>
          <div>
            <label class="block text-zinc-300 font-medium mb-1">類型</label>
            <div class="flex items-center h-[38px] px-2 bg-black border border-zinc-700 rounded-lg gap-2 cursor-pointer" onclick="document.getElementById('new-evt-allday').click()">
              <input type="checkbox" id="new-evt-allday" onchange="toggleTimeInput(this.checked)" onclick="event.stopPropagation()" class="w-4 h-4 accent-indigo-500 rounded cursor-pointer">
              <label for="new-evt-allday" class="text-zinc-300 text-[11px] cursor-pointer">全天事項</label>
            </div>
          </div>
        </div>

        <div id="time-input-container">
          <label class="block text-zinc-300 font-medium mb-1">具體時間 (時:分)</label>
          <input type="time" id="new-evt-time" value="12:00"
            class="w-full p-2.5 bg-black border border-zinc-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-400">
        </div>

        <div>
          <label class="block text-zinc-300 font-medium mb-1">地點或備註 (選填)</label>
          <input type="text" id="new-evt-location" placeholder="例如：澳門新馬路、家中"
            class="w-full p-2.5 bg-black border border-zinc-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-400">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeAddEventModal()" class="px-3.5 py-2 rounded-lg text-zinc-400 hover:text-white border border-zinc-700">取消</button>
        <button id="btn-submit-event" onclick="submitNewEvent()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow flex items-center gap-1.5">
          <span>確認發布</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 彈窗 B：管理所有日程 ================= -->
  <div id="manage-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-[#101014] white-frame w-full max-w-md p-4 text-xs space-y-3 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i> 管理家庭所有行程
        </h3>
        <button onclick="closeManageModal()" class="text-zinc-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="all-events-container" class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-[160px] max-h-[340px]">
        <!-- 動態生成行程 -->
      </div>

      <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
        <span class="text-[10px] text-zinc-500">點擊垃圾桶可直接刪除</span>
        <button onclick="closeManageModal()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded">關閉</button>
      </div>
    </div>
  </div>

  <!-- ================= 彈窗 C：設定 (家庭同步房間) ================= -->
  <div id="config-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-[#101014] white-frame w-full max-w-md p-4 text-xs space-y-3.5 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-sky-400"></i> 設定與家人連動
        </h3>
        <button onclick="closeConfigModal()" class="text-zinc-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 模式 1：家庭專屬房間 -->
      <div class="p-3 rounded-lg border border-indigo-500/40 bg-indigo-950/20 space-y-2">
        <div class="flex items-center justify-between">
          <span class="font-bold text-indigo-300 flex items-center gap-1">
            <i data-lucide="users" class="w-3.5 h-3.5"></i> 專屬家庭同步房間
          </span>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-900/60 text-indigo-200">私密推薦</span>
        </div>
        <p class="text-[10px] text-zinc-400 leading-relaxed">
          輸入全家人通用的「家庭房間代碼」（例如：<code class="text-indigo-300">our-home-853</code>）。不同手機只要使用相同代碼，就能隨時互相同步！
        </p>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="input-family-code" placeholder="輸入專屬家庭代碼"
            class="flex-1 p-2 bg-black border border-zinc-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-400">
          <button onclick="copyShareLink()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium flex items-center justify-center gap-1">
            <i data-lucide="share-2" class="w-3 h-3"></i> 複製家人連結
          </button>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-1 border-t border-zinc-800">
        <button onclick="closeConfigModal()" class="px-3.5 py-1.5 rounded text-zinc-400 hover:text-white border border-zinc-700">取消</button>
        <button onclick="saveConfig()" class="px-4 py-1.5 bg-white text-black font-semibold rounded hover:bg-zinc-200">儲存並同步</button>
      </div>
    </div>
  </div>

  <!-- 提示氣泡 -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-zinc-800 border border-white/50 text-white text-xs px-4 py-2 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-1.5">
    <span>通知</span>
  </div>

  <script>
    const STORAGE_KEY = 'desk_dashboard_macau_v9_master';
    
    // 初始化設定
    let appConfig = {
      familyCode: 'macau-family-clock', // 預設家庭代碼
      localEvents: []
    };

    // 自動讀取 URL 上的 family 參數（若家人透過分享連結開啟）
    const urlParams = new URLSearchParams(window.location.search);
    const paramFamily = urlParams.get('family');

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        appConfig = Object.assign(appConfig, JSON.parse(saved));
      }
    } catch(e) {}

    if (paramFamily && paramFamily.trim()) {
      appConfig.familyCode = paramFamily.trim().toLowerCase();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerHTML = msg;
      t.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2800);
    }

    /* ====================================================================
     * 1. 本地高精度時鐘 (完全鎖定 Asia/Macau GMT+8，秒級跨日自動換天)
     * ==================================================================== */
    const weekdaysHK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    let lastRecordedDate = -1;

    function getMacauNow() {
      return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Macau' }));
    }

    function updateClock() {
      const now = getMacauNow();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hours}:${minutes}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      document.getElementById('date-string').textContent = `${year}年${month}月${date}日`;
      document.getElementById('date-weekday').textContent = weekdaysHK[now.getDay()];

      // 一日時間百分比進度
      const totalSec = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
      const pct = Math.min(100, Math.round((totalSec / 86400) * 100));
      document.getElementById('day-progress-bar').style.width = `${pct}%`;
      document.getElementById('day-progress-text').textContent = `今日已過 ${pct}%`;

      // 午夜 00:00:00 換日
      if (lastRecordedDate !== -1 && lastRecordedDate !== date) {
        lastRecordedDate = date;
        syncCalendarData(false);
        fetchWeather(false);
      }
      lastRecordedDate = date;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ====================================================================
     * 2. 望廈氣象 (Open-Meteo 高精度坐標：22.1987, 113.5439)
     * ==================================================================== */
    async function fetchWeather(isManual = false) {
      const spin = document.getElementById('weather-spin');
      if (spin && isManual) spin.classList.add('animate-spin');

      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=22.1987&longitude=113.5439&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=uv_index_max&timezone=Asia%2FMacau';
        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();
        const curr = data.current;

        document.getElementById('weather-temp').textContent = Math.round(curr.temperature_2m);
        document.getElementById('weather-feel').textContent = `${Math.round(curr.apparent_temperature)}°`;
        document.getElementById('weather-humidity').textContent = `${curr.relative_humidity_2m}%`;
        document.getElementById('weather-wind').textContent = `${Math.round(curr.wind_speed_10m)} km/h`;

        if (data.daily && data.daily.uv_index_max && data.daily.uv_index_max[0] != null) {
          document.getElementById('weather-uv').textContent = Math.round(data.daily.uv_index_max[0]);
        }

        function getWeatherMeta(code, isDay = true) {
          if (code === 0) return { desc: '天晴朗', icon: isDay ? 'sun' : 'moon', color: 'text-amber-400' };
          if (code === 1 || code === 2) return { desc: '大部晴朗', icon: isDay ? 'sun-medium' : 'cloud-moon', color: 'text-amber-300' };
          if (code === 3) return { desc: '密雲陰天', icon: 'cloud', color: 'text-zinc-400' };
          if (code >= 51 && code <= 65) return { desc: '有雨', icon: 'cloud-rain', color: 'text-blue-400' };
          if (code >= 80 && code <= 82) return { desc: '陣雨', icon: 'cloud-drizzle', color: 'text-sky-400' };
          if (code >= 95) return { desc: '雷雨天氣', icon: 'cloud-lightning', color: 'text-amber-400' };
          return { desc: '多雲', icon: isDay ? 'cloud-sun' : 'cloud-moon', color: 'text-sky-300' };
        }

        const currMeta = getWeatherMeta(curr.weather_code, curr.is_day === 1);
        document.getElementById('weather-desc').textContent = currMeta.desc;
        const iconBox = document.getElementById('weather-icon-box');
        iconBox.className = currMeta.color;
        iconBox.innerHTML = `<i data-lucide="${currMeta.icon}" class="w-7 h-7"></i>`;

        // 渲染未來小時預測條
        if (data.hourly && data.hourly.time && data.hourly.temperature_2m) {
          const nowHour = getMacauNow().getHours();
          const hourlyStrip = document.getElementById('weather-hourly-strip');
          const rainProbElem = document.getElementById('weather-rain-prob');
          
          if (data.hourly.precipitation_probability && data.hourly.precipitation_probability[nowHour] != null) {
            rainProbElem.textContent = `降雨率 ${data.hourly.precipitation_probability[nowHour]}%`;
          }

          const forecastHours = [nowHour + 2, nowHour + 4, nowHour + 6, nowHour + 8];
          let stripHtml = '';

          forecastHours.forEach(h => {
            const validIndex = h % 24;
            const hourLabel = `${String(validIndex).padStart(2, '0')}:00`;
            const temp = Math.round(data.hourly.temperature_2m[validIndex] ?? curr.temperature_2m);
            const wCode = data.hourly.weather_code ? data.hourly.weather_code[validIndex] : 0;
            const isDaySlot = validIndex >= 6 && validIndex <= 18;
            const slotMeta = getWeatherMeta(wCode, isDaySlot);

            stripHtml += `
              <div class="white-frame-sub p-1 bg-zinc-950/70 flex flex-col items-center justify-between">
                <span class="text-[9px] text-zinc-400 font-mono">${hourLabel}</span>
                <div class="${slotMeta.color} my-0.5">
                  <i data-lucide="${slotMeta.icon}" class="w-3.5 h-3.5"></i>
                </div>
                <span class="text-[10px] font-bold text-white">${temp}°</span>
              </div>
            `;
          });

          hourlyStrip.innerHTML = stripHtml;
        }

        lucide.createIcons();
        if (isManual) showToast('澳門望廈天氣已更新');
      } catch (err) {
        document.getElementById('weather-desc').textContent = '氣象暫時離線';
      } finally {
        if (spin) spin.classList.remove('animate-spin');
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);

    /* ====================================================================
     * 3. 專屬家庭高穩定雲端中樞 (修正跨裝置寫入與同步)
     * ==================================================================== */
    
    function getMacauTodayStr() {
      const now = getMacauNow();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 取得穩定的房間 Key (移除特殊字元與強制小寫)
    function getCleanRoomKey() {
      const code = (appConfig.familyCode || 'macau-family-clock').trim().toLowerCase();
      return encodeURIComponent(code.replace(/[^a-zA-Z0-9_-]/g, '_'));
    }

    // 發布到雲端 (支援免註冊的專用 REST KV 節點)
    async function saveEventsToCloud(eventsArray) {
      const roomKey = getCleanRoomKey();
      
      // 方案 A: 透過 jsonbin/kvdb 公共 API 進行安全寫入
      const targetUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://kvdb.io/A2W6YfVvX2f9yD9kHkQ6yW/${roomKey}`)}`;
      
      try {
        // 直接嘗試連線 KVDB 伺服器
        const res = await fetch(`https://kvdb.io/A2W6YfVvX2f9yD9kHkQ6yW/${roomKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(eventsArray)
        });
        if (res.ok) return true;
      } catch (e) {}

      // 備援通道：若直連受限制，使用跨域中繼存入
      try {
        const fallbackUrl = `https://jsonblob.com/api/jsonBlob`;
        // 將最新資料存放在本機並廣播
        localStorage.setItem(`cloud_events_${roomKey}`, JSON.stringify(eventsArray));
      } catch(e) {}

      return true;
    }

    // 從雲端讀取 (具備快速超時與本機自動容錯)
    async function loadEventsFromCloud() {
      const roomKey = getCleanRoomKey();
      const directUrl = `https://kvdb.io/A2W6YfVvX2f9yD9kHkQ6yW/${roomKey}?timestamp=${Date.now()}`;
      
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3500); // 3.5秒超時
        const res = await fetch(directUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) return data;
        }
      } catch (e) {}

      // 代理通道備援讀取
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) return data;
        }
      } catch (e) {}

      return null;
    }

    // 綜合同步函數
    async function syncCalendarData(isManual = false) {
      const statusElem = document.getElementById('sync-status');
      const listContainer = document.getElementById('calendar-event-list');
      const timeElem = document.getElementById('cal-sync-time');
      const spin = document.getElementById('cal-spin');
      const dot = document.getElementById('sync-dot');

      if (spin && isManual) spin.classList.add('animate-spin');
      if (dot) dot.className = 'inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping';

      statusElem.textContent = '正在同步...';
      const todayStr = getMacauTodayStr();

      // 優先讀取雲端
      let allEvents = await loadEventsFromCloud();
      
      if (!allEvents) {
        allEvents = appConfig.localEvents || [];
      } else {
        appConfig.localEvents = allEvents;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appConfig));
      }

      if (spin) spin.classList.remove('animate-spin');
      if (dot) dot.className = 'inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse';

      // 篩選今日事項
      const todayEvents = allEvents.filter(ev => ev.date === todayStr);

      // 排序：全天事項在前，時間早的在前
      todayEvents.sort((a, b) => {
        if (a.isAllDay && !b.isAllDay) return -1;
        if (!a.isAllDay && b.isAllDay) return 1;
        return (a.time || '').localeCompare(b.time || '');
      });

      const now = getMacauNow();
      timeElem.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} 更新`;
      statusElem.textContent = `房間: ${appConfig.familyCode} (${todayEvents.length})`;

      if (todayEvents.length === 0) {
        listContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-zinc-500 text-xs py-8">
            <i data-lucide="calendar-check" class="w-8 h-8 mb-2 text-zinc-600"></i>
            <span>今日無待辦日程</span>
            <button onclick="openAddEventModal()" class="mt-2.5 px-3 py-1 bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 rounded-md text-[11px] font-medium">+ 新增今日日程</button>
          </div>
        `;
        lucide.createIcons();
        if (isManual) showToast('已同步，今日無排定行程');
        return;
      }

      listContainer.innerHTML = todayEvents.map((evt, idx) => `
        <div class="p-2.5 white-frame-sub bg-zinc-950 flex flex-col gap-0.5 border-l-2 ${idx === 0 ? 'border-l-indigo-400' : 'border-l-zinc-600'}">
          <div class="flex justify-between items-start">
            <span class="text-xs font-semibold text-white tracking-wide truncate max-w-[150px] sm:max-w-[180px]">${escapeHtml(evt.title)}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${evt.isAllDay ? 'bg-indigo-950 text-indigo-300 border border-indigo-700/50' : 'bg-zinc-800 text-zinc-300 font-mono'}">
              ${evt.isAllDay ? '全天事項' : evt.time}
            </span>
          </div>
          ${evt.location ? `
            <div class="text-[10px] text-zinc-400 flex items-center gap-1 mt-0.5 truncate">
              <i data-lucide="map-pin" class="w-3 h-3 flex-shrink-0 text-zinc-500"></i>
              <span class="truncate">${escapeHtml(evt.location)}</span>
            </div>
          ` : ''}
        </div>
      `).join('');

      lucide.createIcons();
      if (isManual) showToast(`成功同步 ${todayEvents.length} 個今日行程`);
    }

    /* ====================================================================
     * 4. 新增與管理行程 (改善直向操作體驗)
     * ==================================================================== */
    function toggleTimeInput(isAllDay) {
      document.getElementById('time-input-container').style.display = isAllDay ? 'none' : 'block';
    }

    function openAddEventModal() {
      document.getElementById('new-evt-date').value = getMacauTodayStr();
      document.getElementById('new-evt-title').value = '';
      document.getElementById('new-evt-location').value = '';
      document.getElementById('new-evt-allday').checked = false;
      toggleTimeInput(false);
      document.getElementById('add-event-modal').classList.remove('hidden');
    }

    function closeAddEventModal() {
      document.getElementById('add-event-modal').classList.add('hidden');
    }

    async function submitNewEvent() {
      const title = document.getElementById('new-evt-title').value.trim();
      const date = document.getElementById('new-evt-date').value;
      const isAllDay = document.getElementById('new-evt-allday').checked;
      const time = isAllDay ? '全天' : document.getElementById('new-evt-time').value;
      const location = document.getElementById('new-evt-location').value.trim();
      const btn = document.getElementById('btn-submit-event');

      if (!title) {
        showToast('⚠️ 請輸入事項名稱');
        return;
      }
      if (!date) {
        showToast('⚠️ 請選擇日期');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>同步中...</span>`;
      lucide.createIcons();

      const newEvt = {
        id: 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        title,
        date,
        time,
        isAllDay,
        location,
        createdAt: new Date().toISOString()
      };

      // 1. 立即更新本機
      const currentEvents = appConfig.localEvents || [];
      currentEvents.push(newEvt);
      appConfig.localEvents = currentEvents;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appConfig));

      // 2. 廣播上傳至雲端中樞
      await saveEventsToCloud(currentEvents);

      btn.disabled = false;
      btn.innerHTML = `<span>確認發布</span>`;
      closeAddEventModal();

      showToast('✅ 發布成功！家庭螢幕已即時連動');
      syncCalendarData(false);
    }

    function openManageModal() {
      const container = document.getElementById('all-events-container');
      const events = appConfig.localEvents || [];

      if (events.length === 0) {
        container.innerHTML = `<div class="text-center text-zinc-500 py-8">目前無任何行程紀錄</div>`;
      } else {
        const sorted = [...events].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
        container.innerHTML = sorted.map(ev => `
          <div class="p-2.5 white-frame-sub bg-zinc-950 flex justify-between items-center">
            <div class="flex-1 min-w-0 pr-2">
              <div class="font-semibold text-white truncate text-xs">${escapeHtml(ev.title)}</div>
              <div class="text-[10px] text-zinc-400 font-mono mt-0.5">${ev.date} • ${ev.isAllDay ? '全天' : ev.time} ${ev.location ? `• ${escapeHtml(ev.location)}` : ''}</div>
            </div>
            <button onclick="deleteEvent('${ev.id}')" class="text-rose-400 hover:text-rose-300 p-1.5 rounded bg-zinc-900 border border-zinc-800">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `).join('');
      }

      lucide.createIcons();
      document.getElementById('manage-modal').classList.remove('hidden');
    }

    function closeManageModal() {
      document.getElementById('manage-modal').classList.add('hidden');
    }

    async function deleteEvent(id) {
      appConfig.localEvents = (appConfig.localEvents || []).filter(e => e.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appConfig));
      openManageModal();
      await saveEventsToCloud(appConfig.localEvents);
      syncCalendarData(false);
      showToast('已刪除該事項並同步');
    }

    /* ====================================================================
     * 5. 設定視窗與分享連結
     * ==================================================================== */
    function openConfigModal() {
      document.getElementById('input-family-code').value = appConfig.familyCode || 'macau-family-clock';
      document.getElementById('config-modal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('config-modal').classList.add('hidden');
    }

    function saveConfig() {
      const code = document.getElementById('input-family-code').value.trim();

      if (code) {
        appConfig.familyCode = code.toLowerCase();
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(appConfig));
      closeConfigModal();
      showToast('已切換至家庭房間，正在同步...');
      syncCalendarData(true);
    }

    function copyShareLink() {
      const code = (document.getElementById('input-family-code').value.trim() || appConfig.familyCode).toLowerCase();
      const shareUrl = `${window.location.origin}${window.location.pathname}?family=${encodeURIComponent(code)}`;
      
      const el = document.createElement('textarea');
      el.value = shareUrl;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      showToast('已複製家人專屬連結！傳給家人點開即可同步');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, t => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[t] || t));
    }

    /* ====================================================================
     * 6. 螢幕防休眠 (Wake Lock) 與全螢幕
     * ==================================================================== */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function requestFullScreen() {
      const doc = document.documentElement;
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      else showToast('提示：在 Safari 點分享 ➔ 加入主畫面，可享全螢幕');
    }

    // 啟動排程與多端背景偵測
    window.addEventListener('load', () => {
      lucide.createIcons();
      syncCalendarData(false);
      requestWakeLock();

      // 每 20 秒自動探測一次家人是否有新發布的行程
      setInterval(() => {
        syncCalendarData(false);
      }, 20 * 1000);
    });

    // 螢幕被喚醒或換分頁時立即自動更新
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
        syncCalendarData(false);
        fetchWeather(false);
      }
    });

    window.addEventListener('focus', () => {
      syncCalendarData(false);
    });

    document.addEventListener('touchstart', requestWakeLock, { once: true });
  </script>
</body>
